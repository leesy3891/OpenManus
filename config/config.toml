# ======================================================================================
# Profiled execution config example.
# Copy to config/config.toml and fill in real values.
# ======================================================================================

# Main orchestration LLM (API-based, used by PlanningFlow.llm via config_name="default")
[llm]
api_type = "openai"
model = "gpt-5"
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
max_tokens = 4096
temperature = 0.6

# Local HuggingFace profiled sub-LLM (used by ProfiledExecutorAgent via config_name="profiled_qwen")
[llm.profiled_qwen]
api_type = "hf_local"
model = "Qwen/Qwen3-14B"
base_url = ""
api_key = ""
max_tokens = 4096
temperature = 0.6
device_map = "auto"
torch_dtype = "bfloat16"
load_in_4bit = false
load_in_8bit = false
attn_implementation = "eager"
enable_thinking = true
profile_cache = true
profile_dir = "record"

# Vision model — used by ImageQuery tool for image-to-text conversion.
# Replace api_key / model with your actual credentials.
# Any OpenAI-compatible vision endpoint works (OpenAI, Azure, Ollama-vision, etc.).
[llm.vision]
api_type = "openai"
model = "gpt-5.4-mini"
base_url = "https://api.openai.com/v1"
api_key = "sk-..."
max_tokens = 8192
temperature = 0.6

# Alternative: Ollama local vision model
# [llm.vision]
# api_type = "openai"
# model = "llama3.2-vision"
# base_url = "http://localhost:11434/v1"
# api_key = "ollama"
# max_tokens = 4096
# temperature = 0.0

# Optional configuration for specific browser configuration
# [browser]
# Whether to run browser in headless mode (default: false)
#headless = false
# Disable browser security features (default: true)
#disable_security = true
# Extra arguments to pass to the browser
#extra_chromium_args = []
# Path to a Chrome instance to use to connect to your normal browser
# e.g. '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
#chrome_instance_path = ""
# Connect to a browser instance via WebSocket
#wss_url = ""
# Connect to a browser instance via CDP
#cdp_url = ""

# Optional configuration, Proxy settings for the browser
# [browser.proxy]
# server = "http://proxy-server:port"
# username = "proxy-username"
# password = "proxy-password"

# Optional configuration, Search settings.
# [search]
# Search engine for agent to use. Default is "Google", can be set to "Baidu" or "DuckDuckGo".
#engine = "Google"
